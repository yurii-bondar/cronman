name: CI for NPM Module

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    # The integration suite adds a driver per URL and skips the ones that are
    # absent, so these three services are what turn it on. Without them the
    # unit suite still runs in full.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cronman
          POSTGRES_PASSWORD: cronman
          POSTGRES_DB: cronman
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage
        env:
          CRONMAN_TEST_POSTGRES_URL: postgresql://cronman:cronman@127.0.0.1:5432/cronman
          CRONMAN_TEST_MONGO_URL: mongodb://127.0.0.1:27017/cronman
          CRONMAN_TEST_REDIS_URL: redis://127.0.0.1:6379

  semantic-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # The git plugin commits the bumped package.json back to main, so the
        # job needs the whole history to write onto and the token left in place
        # to push with.
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
